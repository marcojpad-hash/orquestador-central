name: Runtime CI
on:
  push:
    branches: [main]
    paths:
      - "runtime/**"
      - "schemas/sequential-verifiable-v1.schema.json"
      - "examples/sequential-verifiable-v1.example.json"
      - ".github/workflows/runtime-ci.yml"
  pull_request:
    paths:
      - "runtime/**"
      - "schemas/sequential-verifiable-v1.schema.json"
      - "examples/sequential-verifiable-v1.example.json"
      - ".github/workflows/runtime-ci.yml"
permissions:
  contents: read
concurrency:
  group: runtime-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install contract validators
        run: python -m pip install -r runtime/requirements.txt
      - name: Contract unit tests
        working-directory: runtime
        run: python -m unittest -v test_runner.py
      - name: Validate frontmatter activation metadata
        run: |
          printf '%s\\n' '---' 'name: demo' 'description: demo contract' 'archetype: sequential-verifiable-v1' '---' '# demo' > /tmp/archetype-demo.md
          python runtime/validate_frontmatter.py /tmp/archetype-demo.md
      - name: End-to-end sequential execution
        run: python runtime/sequential_runner.py --input examples/sequential-verifiable-v1.example.json --timeout 30
      - name: Upload run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-ci-${{ github.run_id }}
          path: |
            runtime/runs/
            artifacts/
          if-no-files-found: warn
          retention-days: 14
