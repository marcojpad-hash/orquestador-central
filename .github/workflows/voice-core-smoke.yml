name: Voice Core structural smoke

on:
  push:
    branches: [main]
    paths:
      - "voice-core/**"
      - ".github/workflows/voice-core-smoke.yml"
  pull_request:
    paths:
      - "voice-core/**"
      - ".github/workflows/voice-core-smoke.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile service without importing model runtime
        run: python -m py_compile voice-core/server.py
      - name: Validate voice profile template
        run: python -m json.tool voice-core/voice_profile.example.json > /dev/null
      - name: Check required service contract
        run: |
          grep -q 'generate_voice_clone' voice-core/server.py
          grep -q 'create_voice_clone_prompt' voice-core/server.py
          grep -q 'voice_id' voice-core/voice_profile.example.json
